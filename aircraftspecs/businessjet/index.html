<body>
    <div id="site-nav"></div>

    <div class="general-title" style="background-image: url(/assets/aircraftspecs/Jet-Background.png);">
        <div class="general-title-inner">
            <div class="general-title-box">
                <p class="general-title-english">Business Jets</p>
                <div class="general-title-icon">
                    <img src="/assets/aircraftspecs/Jet-Icon-White.png" alt="">
                </div>
                <h1 class="general-title-title">ビジネスジェット</h1>
            </div>
        </div>
    </div>

    <div class="general-heading">
        <div class="general-heading-inner">
            <p>ビジネスジェットは、少人数での移動に特化した航空機です。快適性と機動性を兼ね備え、短距離移動に適した軽量機から、大陸間飛行に対応する超長距離機まで幅広い機種が存在します。高い柔軟性とプライバシー性に加え、移動時間の効率化を実現できることも大きな特徴です。また、定期航空便では利用が難しい空港へのアクセスが可能なため、目的地や運航計画に応じた自由度の高い移動を提供します。</p>
        </div>
    </div>

    <!-- Aircraft Search + Listings Section -->
    <section class="specs-search-section">
        <div class="specs-search-inner global-inner">
            <h2 class="specs-section-title global-title">航空機検索</h2>
            <div class="specs-search-card global-card">
                <p class="specs-search-desc">お探しの航空機はお決まりですか？以下に入力して、該当ページへ直接移動できます。</p>
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="航空機を検索...">
                    <button class="search-button" id="searchButton">
                        <span>🔍</span>
                    </button>
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>
        </div>
        <div class="global-inner">
        </div>
    </section>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="/js/main.js?v=2"></script>
    <script src="/js/includes.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/english.js"></script>
    <script src="/js/language.js"></script>
    <script src="/js/aircraftspecs.js"></script>
    <script>
        function toggleCategory(categoryId) {
            const content = document.getElementById(categoryId);
            const button = content.previousElementSibling;
            const icon = button.querySelector('.toggle-icon');
            
            if (content.style.display === 'none' || content.style.display === '') {
                content.style.display = 'block';
                icon.classList.add('rotated');
            } else {
                content.style.display = 'none';
                icon.classList.remove('rotated');
            }
        }
    </script>

            "Cessna Citation Longitude": {'\u822a\u7d9a\u8ddd\u96e2': "3,500 NM", '\u6700\u5927\u901f\u5ea6': "483 KTS", '\u4e57\u5ba2\u6570': "12"},

            "Gulfstream G400": {'\u822a\u7d9a\u8ddd\u96e2': "4,200 NM", '\u6700\u5927\u901f\u5ea6': "541 KTS", '\u4e57\u5ba2\u6570': "12"},
            "Gulfstream G450": {'\u822a\u7d9a\u8ddd\u96e2': "4,350 NM", '\u6700\u5927\u901f\u5ea6': "516 KTS", '\u4e57\u5ba2\u6570': "14"},
            "Gulfstream G500": {'\u822a\u7d9a\u8ddd\u96e2': "5,200 NM", '\u6700\u5927\u901f\u5ea6': "516 KTS", '\u4e57\u5ba2\u6570': "16"},
            "Gulfstream G550": {'\u822a\u7d9a\u8ddd\u96e2': "6,750 NM", '\u6700\u5927\u901f\u5ea6': "516 KTS", '\u4e57\u5ba2\u6570': "19"},
            "Gulfstream G600": {'\u822a\u7d9a\u8ddd\u96e2': "6,500 NM", '\u6700\u5927\u901f\u5ea6': "516 KTS", '\u4e57\u5ba2\u6570': "19"},
            "Gulfstream G650": {'\u822a\u7d9a\u8ddd\u96e2': "7,000 NM", '\u6700\u5927\u901f\u5ea6': "530 KTS", '\u4e57\u5ba2\u6570': "19"},
            "Gulfstream G650ER": {'\u822a\u7d9a\u8ddd\u96e2': "7,500 NM", '\u6700\u5927\u901f\u5ea6': "530 KTS", '\u4e57\u5ba2\u6570': "19"}
        };
        const container = document.querySelector('.specs-search-section .global-inner:last-of-type');
        container.innerHTML = '';

        const pagePaths = {
            "Gulfstream G200": "/aircraftspecs/businessjet/gulfstream/G200/",
            "Gulfstream G280": "/aircraftspecs/businessjet/gulfstream/G280/",
            "Gulfstream G400": "/aircraftspecs/businessjet/gulfstream/G400/",
            "Gulfstream G450": "/aircraftspecs/businessjet/gulfstream/G450/",
            "Gulfstream G500": "/aircraftspecs/businessjet/gulfstream/G500/",
            "Gulfstream G550": "/aircraftspecs/businessjet/gulfstream/G550/",
            "Gulfstream G600": "/aircraftspecs/businessjet/gulfstream/G600/",
            "Gulfstream G650": "/aircraftspecs/businessjet/gulfstream/G650/",
            "Gulfstream G650ER": "/aircraftspecs/businessjet/gulfstream/G650ER/"
        };

        const brands = {
            "Cessna": [
                "Cessna Citation Mustang",
                "Cessna Citation CJ1 Series",
                "Cessna Citation CJ2 Series",
                "Cessna Citation CJ3 Series",
                "Cessna Citation CJ4 Series",
                "Cessna Citation Sovereign",
                "Cessna Citation Latitude",
                "Cessna Citation X",
                "Cessna Citation Longitude"
            ],
            "Gulfstream": [
                "Gulfstream G150",
                "Gulfstream G200",
                "Gulfstream G280",
                "Gulfstream G300",
                "Gulfstream G350",
                "Gulfstream G400",
                "Gulfstream G450",
                "Gulfstream G500",
                "Gulfstream G550",
                "Gulfstream G600",
                "Gulfstream G650",
                "Gulfstream G650ER"
            ],
            "HondaJet": [
                "HondaJet HA-420",
                "HondaJet Elite",
                "HondaJet Elite S",
                "HondaJet Elite II"
            ]
        };

        Object.entries(brands).forEach(([brand, models]) => {
            const section = document.createElement('div');
            section.className = 'category-section';
            section.innerHTML = `
                <button class="category-toggle" onclick="toggleCategory('${brand.toLowerCase()}')">
                    <span class="toggle-icon">▼</span>
                    <h2 style="display:inline;margin:0;">${brand}</h2>
                </button>
                <div id="${brand.toLowerCase()}" class="category-content" style="display:none;">
                    <div class="aircraft-grid"></div>
                </div>
            `;

            const grid = section.querySelector('.aircraft-grid');
            models.forEach(name => {
                const card = pagePaths[name] ? document.createElement('a') : document.createElement('div');
                if (pagePaths[name]) {
                    card.href = pagePaths[name];
                    card.className = 'aircraft-card available';
                } else {
                    card.className = 'aircraft-card unavailable';
                }

                const img = document.createElement('div');
                img.className = 'aircraft-card-image';
                if (name === 'Gulfstream G550') {
                    img.style.backgroundImage = "url('/assets/aircraftspecs/aircrafts/gulfstream/Gulfstream-G550-Background.png')";
                    img.style.backgroundSize = 'cover';
                    img.style.backgroundPosition = 'center';
                } else {
                    img.textContent = '✈️';
                }

                const content = document.createElement('div');
                content.className = 'aircraft-card-content';

                const h3 = document.createElement('h3');
                h3.className = 'aircraft-card-name';
                h3.textContent = name;

                const specsDiv = document.createElement('div');
                specsDiv.className = 'aircraft-card-specs';

                const isEn = localStorage.getItem('preferredLang') === 'en';
                const labelMap = {
                    '航続距離': { ja: '最大航続距離', en: 'Max Range' },
                    '最大速度':  { ja: '最大速度',     en: 'Max Speed' },
                    '乗客数':   { ja: '最大乗客数',   en: 'Max Passengers' }
                };
                [['航続距離'], ['最大速度'], ['乗客数']].forEach(([key]) => {
                    if (!specs[name] || !specs[name][key]) return;
                    const spec = document.createElement('div');
                    spec.className = 'aircraft-card-spec';
                    const displayLabel = isEn ? labelMap[key].en : labelMap[key].ja;
                    spec.innerHTML = `<span class="aircraft-card-spec-label">${displayLabel}</span><span class="aircraft-card-spec-value">${specs[name][key]}</span>`;
                    specsDiv.append(spec);
                });

                content.append(h3, specsDiv);
                card.append(img, content);
                grid.append(card);
            });

            container.appendChild(section);
        });
    });
    </script>
</body>
</html>
